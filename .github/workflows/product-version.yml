name: product-version

on:
  push:
    branches: [main]
  schedule:
    # Catch missed/suppressed notifications, including merges performed with GITHUB_TOKEN.
    # Offset from the busiest top-of-hour scheduling window; scheduler latency is not a release SLA.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-version-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      # Always check out trusted current main, not event-controlled PR/fork code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install locked generator dependencies
        run: |
          uv sync --locked --dev
          pnpm --dir apps/web install --frozen-lockfile
      - name: Reconcile merged PRs and preserve all original CI gates
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          uv run --locked python -m scripts.release.version_workflow --repository "$VERSION_REPOSITORY"
