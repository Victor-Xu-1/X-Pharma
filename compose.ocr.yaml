services:
  ocr:
    image: pharma-intelligence-ocr:3.5.0-paddle3.3.1
    build:
      context: .
      dockerfile: services/ocr/Dockerfile
      args:
        OCR_PYPI_INDEX_URL: ${OCR_PYPI_INDEX_URL:-https://pypi.org/simple}
    environment:
      OCR_SERVICE_HOST: 0.0.0.0
      OCR_SERVICE_PORT: "8071"
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:-local-ocr-service-token-change-before-production}
      OCR_SERVICE_MAX_FILE_BYTES: "268435456"
      OCR_SERVICE_MAX_TEXT_CHARS: "50000000"
      OCR_SERVICE_MAX_PAGES: "100"
      OCR_SERVICE_MAX_PAGE_PIXELS: "100000000"
      OCR_SERVICE_MAX_LINES: "1000000"
      OCR_SERVICE_MIN_CONFIDENCE: "0.5"
      OCR_SERVICE_MAX_CONCURRENT_REQUESTS: "1"
      OCR_SERVICE_LIMIT_CONCURRENCY: "4"
      OCR_SERVICE_DETECTION_MODEL_DIR: /models/PP-OCRv5_server_det
      OCR_SERVICE_RECOGNITION_MODEL_DIR: /models/PP-OCRv5_server_rec
      OCR_SERVICE_DETECTION_MODEL_SHA256: ec4f33f2eaedab78202156d61c79e2b81c020d2007a0336aa3777bb44a5a5ad0
      OCR_SERVICE_RECOGNITION_MODEL_SHA256: 02369df6f07caf77a9892b0d598b4fa71a831e31b087aa8d727d34ef5cee3a8f
      OCR_SERVICE_PADDLEOCR_VERSION: 3.5.0
      OCR_SERVICE_PADDLEPADDLE_VERSION: 3.3.1
    expose:
      - "8071"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8071/health/ready')
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=3g,mode=1777
    pids_limit: 128
    mem_limit: 8g
    cpus: 4.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${OCR_MODEL_ROOT:?OCR_MODEL_ROOT must be an absolute WSL path}/PP-OCRv5_server_det:/models/PP-OCRv5_server_det:ro
      - ${OCR_MODEL_ROOT:?OCR_MODEL_ROOT must be an absolute WSL path}/PP-OCRv5_server_rec:/models/PP-OCRv5_server_rec:ro
    networks:
      - ocr-sandbox

  worker:
    environment:
      OCR_BACKEND: service
      OCR_SERVICE_URL: http://ocr:8071
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:-local-ocr-service-token-change-before-production}
      OCR_SERVICE_MAX_FILE_BYTES: "268435456"
      OCR_SERVICE_REQUEST_TIMEOUT_SECONDS: "600"
      OCR_SERVICE_VERIFY_CERTS: "false"
    depends_on:
      ocr:
        condition: service_healthy
    networks:
      - default
      - parser-sandbox
      - ocr-sandbox

networks:
  ocr-sandbox:
    internal: true
