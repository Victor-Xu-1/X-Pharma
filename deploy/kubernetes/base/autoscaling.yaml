---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pharma-clamav
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: pharma-clamav
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 900
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
