apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pharma-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pharma-api
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
