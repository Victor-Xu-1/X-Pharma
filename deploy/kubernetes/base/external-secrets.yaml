apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pharma-openbao
  labels:
    app.kubernetes.io/part-of: pharma-intelligence
spec:
  provider:
    vault:
      server: https://openbao.example.com:8200
      path: pharma-kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: pharma-intelligence-production
          serviceAccountRef:
            name: pharma-secret-reader
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pharma-platform-secrets
  labels:
    app.kubernetes.io/part-of: pharma-intelligence
spec:
  refreshPolicy: Periodic
  refreshInterval: 50m
  secretStoreRef:
    name: pharma-openbao
    kind: SecretStore
  target:
    name: pharma-platform-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        DATABASE_URL: >-
          postgresql+psycopg://{{ .DB_RUNTIME_USERNAME }}:{{ .DB_RUNTIME_PASSWORD | urlquery }}@postgres-rw.database.svc.cluster.local:5432/pharma
  data:
    - secretKey: JWT_SECRET
      remoteRef: {key: production/application, property: JWT_SECRET}
    - secretKey: INTERNAL_SERVICE_JWT_SECRET
      remoteRef: {key: production/application, property: INTERNAL_SERVICE_JWT_SECRET}
    - secretKey: TENANT_CONTEXT_SIGNING_SECRET
      remoteRef: {key: production/application, property: TENANT_CONTEXT_SIGNING_SECRET}
    - secretKey: MCP_CURSOR_SIGNING_SECRET
      remoteRef: {key: production/application, property: MCP_CURSOR_SIGNING_SECRET}
    - secretKey: MCP_CORRELATION_HMAC_SECRET
      remoteRef: {key: production/application, property: MCP_CORRELATION_HMAC_SECRET}
    - secretKey: REDIS_URL
      remoteRef: {key: production/application, property: REDIS_URL}
    - secretKey: BILLING_STATEMENT_SIGNING_SECRET
      remoteRef: {key: production/application, property: BILLING_STATEMENT_SIGNING_SECRET}
    - secretKey: EXPORT_MANIFEST_SIGNING_SECRET
      remoteRef: {key: production/application, property: EXPORT_MANIFEST_SIGNING_SECRET}
    - secretKey: API_KEY_HASH_SALT
      remoteRef: {key: production/application, property: API_KEY_HASH_SALT}
    - secretKey: HUMAN_OIDC_CLIENT_SECRET
      remoteRef: {key: production/application, property: HUMAN_OIDC_CLIENT_SECRET}
    - secretKey: OBJECT_STORE_S3_ACCESS_KEY_ID
      remoteRef: {key: production/application, property: OBJECT_STORE_S3_ACCESS_KEY_ID}
    - secretKey: OBJECT_STORE_S3_SECRET_ACCESS_KEY
      remoteRef: {key: production/application, property: OBJECT_STORE_S3_SECRET_ACCESS_KEY}
    - secretKey: AI_API_KEY
      remoteRef: {key: production/application, property: AI_API_KEY}
    - secretKey: LLM_CREDENTIALS_ENCRYPTION_KEY
      remoteRef: {key: production/application, property: LLM_CREDENTIALS_ENCRYPTION_KEY}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: pharma-database-runtime
      rewrite:
        - regexp:
            source: username
            target: DB_RUNTIME_USERNAME
        - regexp:
            source: password
            target: DB_RUNTIME_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pharma-document-processing-secrets
  labels:
    app.kubernetes.io/part-of: pharma-intelligence
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    name: pharma-openbao
    kind: SecretStore
  target:
    name: pharma-document-processing-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PARSER_SERVICE_TOKEN
      remoteRef: {key: production/document-processing, property: parser_service_token}
    - secretKey: OCR_SERVICE_TOKEN
      remoteRef: {key: production/document-processing, property: ocr_service_token}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: pharma-database-runtime
  labels:
    app.kubernetes.io/part-of: pharma-intelligence
spec:
  path: database/creds/pharma-runtime
  method: GET
  resultType: Data
  provider:
    server: https://openbao.example.com:8200
    auth:
      kubernetes:
        mountPath: kubernetes
        role: pharma-intelligence-production
        serviceAccountRef:
          name: pharma-secret-reader
          audiences:
            - openbao
---
apiVersion: external-secrets.io/v1
