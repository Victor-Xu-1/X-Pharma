apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pharma-compiled-wiki
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: replace-with-rwx-storage-class
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pharma-source-readonly
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: replace-with-enterprise-source-class
  resources:
    requests:
      storage: 5Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pharma-ocr-models
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: replace-with-enterprise-model-storage-class
  resources:
    requests:
      storage: 2Gi
