  HUMAN_OIDC_DEFAULT_ROLE: viewer
  HUMAN_OIDC_ROLE_CLAIM: groups
  HUMAN_OIDC_ROLE_MAPPING_JSON: '{"pharma-analysts":"analyst"}'
  MCP_AUTH_ENABLED: "true"
  MCP_TOKEN_VERIFIER_MODE: oidc
  MCP_AUTH_ISSUER_URL: https://identity.example.com
  MCP_RESOURCE_SERVER_URL: https://mcp.example.com/mcp
  MCP_OIDC_JWKS_URL: https://identity.example.com/.well-known/jwks.json
