  OBJECT_STORE_BACKEND: s3
  OBJECT_STORE_S3_ENDPOINT_URL: https://s3.example.com
  OBJECT_STORE_S3_REGION: us-east-1
  OBJECT_STORE_S3_BUCKET: pharma-intelligence-production
