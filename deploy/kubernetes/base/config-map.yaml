  OPENSEARCH_REQUEST_TIMEOUT_SECONDS: "10"
  OPENSEARCH_MAX_RETRIES: "3"
  OPENSEARCH_POOL_MAXSIZE: "50"
  OPENSEARCH_INDEX_PREFIX: pharma
  OPENSEARCH_INDEX_SHARDS: "6"
  OPENSEARCH_INDEX_REPLICAS: "1"
  SEARCH_SEMANTIC_ENABLED: "true"
  SEARCH_EMBEDDING_BASE_URL: https://model-gateway.example.com/v1
