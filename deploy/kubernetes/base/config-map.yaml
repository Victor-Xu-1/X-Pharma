apiVersion: v1
kind: ConfigMap
metadata:
  name: pharma-platform-config
data:
  APP_ENV: production
  APP_HOST: 0.0.0.0
  APP_PORT: "8080"
  MCP_HOST: 0.0.0.0
  MCP_PORT: "8090"
  LOG_LEVEL: INFO
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://pharma-collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_METRIC_EXPORT_INTERVAL_MS: "60000"
  API_DOCS_ENABLED: "false"
  DATABASE_CREDENTIALS_MODE: openbao_dynamic
  POSTGRES_RUNTIME_USER: pharma_runtime
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"
  DATABASE_POOL_TIMEOUT_SECONDS: "30"
  DATABASE_POOL_RECYCLE_SECONDS: "900"
  PUBLIC_BASE_URL: https://workspace.example.com
