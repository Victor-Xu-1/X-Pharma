  INGEST_MAX_FILE_BYTES: "1073741824"
  PARSER_MAX_TEXT_CHARS: "50000000"
  DOCUMENT_PROCESSING_CREDENTIALS_REQUIRED: "false"
  PARSER_BACKEND: service
