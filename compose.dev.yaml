services:
  postgres:
    command:
      - postgres
      - -c
      - checkpoint_timeout=${POSTGRES_ACCEPTANCE_CHECKPOINT_TIMEOUT:-30min}
      - -c
      - max_wal_size=${POSTGRES_ACCEPTANCE_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_completion_target=${POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
    ports:
      - "127.0.0.1:5433:5432"
  opensearch:
    ports:
      - "127.0.0.1:9200:9200"
  redis:
    ports:
      - "127.0.0.1:6380:6379"
